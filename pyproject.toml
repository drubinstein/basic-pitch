[project]
name = "basic-pitch"
version = "0.4.0"
description = "Basic Pitch, a lightweight yet powerful audio-to-MIDI converter with pitch bend detection."
readme = "README.md"
keywords = []
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Natural Language :: English",
	"Operating System :: POSIX :: Linux",
	"Operating System :: MacOS :: MacOS X",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
	"coremltools; platform_system == 'Darwin'",
	"librosa>=0.8.0",
	"mir_eval>=0.6.0",
	"numpy>=1.18",
	"onnxruntime; platform_system == 'Windows' and python_version < '3.11'",
	"pretty_midi>=0.2.9",
	"resampy>=0.2.2,<0.4.3",
	"scikit-learn",
	"scipy>=1.4.1",
	"tensorflow>=2.4.1,<2.15.1; platform_system != 'Darwin' and python_version >= '3.11'",
	"tensorflow-macos>=2.4.1,<2.15.1; platform_system == 'Darwin' and python_version > '3.11'",
	"ai-edge-litert; platform_system == 'Linux' and python_version >= '3.10'",
	"tflite-runtime; platform_system == 'Linux' and python_version < '3.10'",
	"typing_extensions",
]

[metadata]
author = "Spotify"
author_email = "basic-pitch@spotify.com"
maintainer = "Spotify"
maintainer_email = "basic-pitch@spotify.com"
url = "https://github.com/spotify/basic-pitch"
long_description = "Basic Pitch, a lightweight yet powerful audio-to-MIDI converter with pitch bend detection. See https://github.com/spotify/basic-pitch for more details."
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]
namespaces = false

[project.scripts]
basic-pitch = "basic_pitch.predict:main"
bp-download = "basic_pitch.data.download:main"

[project.optional-dependencies]
data = [
    "basic_pitch[tf,test]",
    "apache_beam",
    "mirdata>=1.0.0",
    "smart_open",
    "sox",
    "ffmpeg-python"
]
test = [
	"basic_pitch[data]",
	"coverage>=5.0.2",
	"pytest>=6.1.1",
	"pytest-mock",
	"mido"
]
tf = [
	"tensorflow>=2.4.1,<2.15.1; platform_system != 'Darwin'",
	"tensorflow-macos>=2.4.1,<2.15.1; platform_system == 'Darwin' and python_version > '3.7'",
]
coreml = ["coremltools"] 
litert = ["ai-edge-litert; python_version >= '3.10'"]
onnx = ["onnxruntime"]
docs = ["mkdocs>=1.0.4"]
dev = [
	"basic_pitch[data,test,tf,coreml,onnx,docs]",
	"ruff",
	"tox",
	"ty",
]

[tool.distutils.bdist_wheel]
universal = true

[build-system]
requires = [
	"setuptools>=40.8.0",
	"wheel",
	"cython",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
# pycodestyle + pyflakes (what flake8 ran) plus annotations, which mypy --strict required.
select = ["E", "W", "F", "ANN"]
ignore = ["E731", "ANN204", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ty.analysis]
# Optional runtimes and data-pipeline dependencies: treat as untyped whether or not they're installed,
# so results don't depend on which extras an environment has.
replace-imports-with-any = [
	"ai_edge_litert", "ai_edge_litert.**",
	"apache_beam", "apache_beam.**",
	"coremltools", "coremltools.**",
	"ffmpeg", "ffmpeg.**",
	"mirdata", "mirdata.**",
	"onnxruntime", "onnxruntime.**",
	"sox", "sox.**",
	"tensorflow", "tensorflow.**",
	"tflite_runtime", "tflite_runtime.**",
]
