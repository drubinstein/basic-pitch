[tox]
envlist = py38,py39,py310,py311,full,data,manifest,check-formatting,lint,typecheck
skipsdist = True
usedevelop = True
requires =
    setuptools>=60
    wheel
    pip>=24

# Tests with the minimal package (either coreml/onnx/tflite)
[testenv]
deps = -e .[test]
commands =
    pytest tests --ignore tests/test_nn.py --ignore tests/data {posargs}
setenv =
    SOURCE = {toxinidir}/basic_pitch
    TEST_SOURCE = {toxinidir}/tests
    LINE_LENGTH = "120"

# Tests with TF
[testenv:full]
deps = -e .[dev]
commands =
    pytest tests {posargs}
setenv =
    SOURCE = {toxinidir}/basic_pitch
    TEST_SOURCE = {toxinidir}/tests
    LINE_LENGTH = "120"

[testenv:data]
deps = -e .[data]
commands = 
    pytest tests/data {posargs}

[testenv:manifest]
deps = check-manifest
skip_install = true
commands = check-manifest --ignore 'tests'

[testenv:check-formatting]
basepython = python3.10
deps = ruff==0.17.6
skip_install = true
commands = ruff format --check --diff

[testenv:format]
basepython = python3.10
deps = ruff==0.17.6
skip_install = true
commands =
    ruff format
    ruff check --fix

[testenv:lint]
basepython = python3.10
deps = ruff==0.17.6
skip_install = true
commands = ruff check

[testenv:typecheck]
basepython = python3.10
deps = ty==0.0.107
commands = ty check --python {envdir} basic_pitch tests

[pytest]
addopts = -v
testpaths = tests
